<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Exact layered Kokomonster Japanese festival artwork</title>
  <desc id="desc">The supplied Japanese festival artwork reconstructed from its exact pixels as independently selectable SVG layers.</desc>
  <defs>
    <path id="p-koko" d="M75 70 430 65 510 150 472 280 452 420 320 448 210 405 105 430 35 345 72 260Z"/>
    <path id="p-gohanko" d="M775 110 1115 90 1220 188 1190 365 1115 445 930 465 785 405 720 290Z"/>
    <path id="p-rabbit" d="M10 405 245 390 355 490 338 735 250 805 55 770 0 650Z"/>
    <path id="p-bear" d="M10 705 455 690 510 985 410 1138 90 1125 0 960Z"/>
    <path id="p-yauyau" d="M520 790 915 790 945 1115 650 1170 505 1010Z"/>
    <path id="p-tree" d="M900 515 1254 500 1254 970 1090 1020 880 900Z"/>
    <path id="p-left-lantern" d="M18 260 196 258 208 518 15 520Z"/>
    <path id="p-right-lantern" d="M1035 262 1245 255 1254 555 1028 555Z"/>
    <path id="p-fan" d="M885 38 1215 35 1220 275 875 275Z"/>
    <path id="p-sun-fuji" d="M345 65 895 60 900 370 340 372Z"/>
    <path id="p-title" d="M205 318Q625 285 1088 360L1065 850Q630 885 230 835Z"/>
    <path id="p-waves" d="M805 900 1195 900 1210 1150 790 1150Z"/>
    <path id="p-logo" d="M430 1130 825 1130 830 1248 425 1248Z"/>
    <clipPath id="c-koko"><use xlink:href="#p-koko"/></clipPath><clipPath id="c-gohanko"><use xlink:href="#p-gohanko"/></clipPath>
    <clipPath id="c-rabbit"><use xlink:href="#p-rabbit"/></clipPath><clipPath id="c-bear"><use xlink:href="#p-bear"/></clipPath>
    <clipPath id="c-yauyau"><use xlink:href="#p-yauyau"/></clipPath><clipPath id="c-tree"><use xlink:href="#p-tree"/></clipPath>
    <clipPath id="c-left-lantern"><use xlink:href="#p-left-lantern"/></clipPath><clipPath id="c-right-lantern"><use xlink:href="#p-right-lantern"/></clipPath>
    <clipPath id="c-fan"><use xlink:href="#p-fan"/></clipPath><clipPath id="c-sun-fuji"><use xlink:href="#p-sun-fuji"/></clipPath>
    <clipPath id="c-title"><use xlink:href="#p-title"/></clipPath><clipPath id="c-waves"><use xlink:href="#p-waves"/></clipPath><clipPath id="c-logo"><use xlink:href="#p-logo"/></clipPath>
    <mask id="m-residual" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254">
      <rect width="1254" height="1254" fill="white"/>
      <g fill="black"><use xlink:href="#p-koko"/><use xlink:href="#p-gohanko"/><use xlink:href="#p-rabbit"/><use xlink:href="#p-bear"/><use xlink:href="#p-yauyau"/><use xlink:href="#p-tree"/><use xlink:href="#p-left-lantern"/><use xlink:href="#p-right-lantern"/><use xlink:href="#p-fan"/><use xlink:href="#p-sun-fuji"/><use xlink:href="#p-title"/><use xlink:href="#p-waves"/><use xlink:href="#p-logo"/></g>
    </mask>
    <mask id="m-title-clean" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254">
      <rect width="1254" height="1254" fill="black"/><use xlink:href="#p-title" fill="white"/>
      <g fill="black"><use xlink:href="#p-koko"/><use xlink:href="#p-gohanko"/><use xlink:href="#p-rabbit"/><use xlink:href="#p-tree"/></g>
    </mask>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="00 Canvas" id="canvas"><rect width="1254" height="1254" fill="#fffaf4"/></g>
  <g inkscape:groupmode="layer" inkscape:label="00 Exact source composite — visible browser preview" id="exact-composite"><image width="1254" height="1254" xlink:href="layers/exact-source.png"/></g>
  <g inkscape:groupmode="layer" inkscape:label="00 Reference underlay — hidden" id="fidelity-underlay" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png"/></g>
  <g inkscape:groupmode="layer" inkscape:label="01 Background and loose accents" id="residual" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" mask="url(#m-residual)"/></g>
  <g inkscape:groupmode="layer" inkscape:label="02 Sun and Mount Fuji" id="sun-fuji" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-sun-fuji)"/></g>
  <g inkscape:groupmode="layer" inkscape:label="03 Folding fan" id="fan" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-fan)"/></g>
  <g inkscape:groupmode="layer" inkscape:label="04 Left festival lantern" id="left-lantern" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-left-lantern)"/><g inkscape:groupmode="layer" inkscape:label="04a Left lantern blank label" id="left-lantern-blank-label"><path d="M59 331 Q111 314 166 332 L175 452 Q118 468 59 449Z" fill="#fffaf4"/></g></g>
  <g inkscape:groupmode="layer" inkscape:label="05 Right festival lantern" id="right-lantern" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-right-lantern)"/><g inkscape:groupmode="layer" inkscape:label="05a Right lantern blank label" id="right-lantern-blank-label"><path d="M1068 332 Q1138 313 1204 334 L1210 482 Q1138 500 1068 478Z" fill="#fffaf4"/></g></g>
  <g inkscape:groupmode="layer" inkscape:label="04 Editable left lantern blank label" id="editable-left-lantern-label"><path d="M59 331 Q111 314 166 332 L175 452 Q118 468 59 449Z" fill="#fffaf4"/></g>
  <g inkscape:groupmode="layer" inkscape:label="05 Editable right lantern blank label" id="editable-right-lantern-label"><path d="M1068 332 Q1138 313 1204 334 L1210 482 Q1138 500 1068 478Z" fill="#fffaf4"/></g>
  <g inkscape:groupmode="layer" inkscape:label="06 Editable title — やさしい日本語" id="exact-title"><path id="title-panel" d="M205 318Q625 285 1088 360L1065 850Q630 885 230 835Z" fill="#4b16b8"/><g inkscape:groupmode="layer" inkscape:label="06a Live Japanese title text" id="title-text" fill="#fffdf8" text-anchor="middle" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-weight="900"><text x="635" y="585" font-size="205" letter-spacing="-14">やさしい</text><text x="635" y="795" font-size="220" letter-spacing="-16">日本語</text></g></g>
  <g inkscape:groupmode="layer" inkscape:label="07 Koko" id="koko" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-koko)"/></g>
  <g inkscape:groupmode="layer" inkscape:label="08 Gohanko and shoyu bottle" id="gohanko" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-gohanko)"/></g>
  <g inkscape:groupmode="layer" inkscape:label="09 Rabbit and dango" id="rabbit" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-rabbit)"/></g>
  <g inkscape:groupmode="layer" inkscape:label="10 Bear and taiko" id="bear" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-bear)"/></g>
  <g inkscape:groupmode="layer" inkscape:label="11 Yauyau" id="yauyau" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-yauyau)"/></g>
  <g inkscape:groupmode="layer" inkscape:label="12 Tree and maple leaf" id="tree" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-tree)"/></g>
  <g inkscape:groupmode="layer" inkscape:label="13 Seigaiha wave cluster" id="waves" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-waves)"/></g>
  <g inkscape:groupmode="layer" inkscape:label="14 Exact supplied logo artwork" id="exact-logo" style="display:none"><image width="1254" height="1254" xlink:href="layers/exact-source.png" clip-path="url(#c-logo)"/></g>
  <g inkscape:groupmode="layer" inkscape:label="15 Previous title alternative (hidden)" id="live-title" style="display:none" fill="#fffdf8" text-anchor="middle" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-weight="900" letter-spacing="-12">
    <path d="M220 335Q625 290 1075 370L1055 845Q630 885 240 830Z" fill="#7128e5"/>
    <text x="635" y="575" font-size="215">にほんご</text><text x="635" y="790" font-size="235">まつり</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="16 Official logo replacement (hidden)" id="official-logo" style="display:none"><image x="455" y="1160" width="350" height="99" xlink:href="layers/official-logo.png"/></g>
